name: Frappe-v16-多应用全家桶构建

on:
  push:
    branches: [ main ]
  workflow_dispatch:
 
env:
  FRAPPE_VERSION: v16.31.0          # https://github.com/frappe/frappe
  ERPNEXT_VERSION: v16.32.3         # https://github.com/frappe/erpnext
  HRMS_VERSION: v16.16.0            # https://github.com/frappe/hrms
  CRM_VERSION: v1.81.2             # https://github.com/frappe/crm
  INSIGHTS_VERSION: v3.12.6        # https://github.com/frappe/insights

  FENGJING_VERSION: develop        # https://github.com/1060778506/fengjing_app
  #DYEPRINT_VERSION: develop        # https://github.com/1060778506/dyeprint

  ERPNEXT_CHINA_VERSION: master    # https://gitee.com/yuzelin/erpnext_china

  BEAM_VERSION: v15.11.1           # https://github.com/agritheory/beam
  PRINT_DESIGNER_VERSION: v1.6.7   # https://github.com/frappe/print_designer
  BUILDER_VERSION: v1.32.0         # https://github.com/frappe/builder
  WIKI_VERSION: master             # https://github.com/frappe/wiki
  CRISPY_PRINT_VERSION: develop    # https://github.com/agatho-daemon/crispy_print

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 拉取本仓库代码
        uses: actions/checkout@v5

      - name: 2. 准备官方 Containerfile 和 apps.json
        run: |
          git clone --depth 1 https://github.com/frappe/frappe_docker.git official_repo

          cat > official_repo/apps.json <<EOF
          [
            {"url": "https://github.com/frappe/erpnext", "branch": "${ERPNEXT_VERSION}"},
            {"url": "https://github.com/frappe/hrms", "branch": "${HRMS_VERSION}"},
            {"url": "https://github.com/frappe/crm", "branch": "${CRM_VERSION}"},
            {"url": "https://github.com/frappe/insights", "branch": "${INSIGHTS_VERSION}"},
            {"url": "https://github.com/1060778506/fengjing_app.git", "branch": "${FENGJING_VERSION}"},
            {"url": "https://github.com/1060778506/dyeprint.git", "branch": "${DYEPRINT_VERSION}"},
            {"url": "https://gitee.com/yuzelin/erpnext_china.git", "branch": "${ERPNEXT_CHINA_VERSION}"},
            {"url": "https://github.com/agritheory/beam", "branch": "${BEAM_VERSION}"},
            {"url": "https://github.com/frappe/print_designer", "branch": "${PRINT_DESIGNER_VERSION}"},
            {"url": "https://github.com/frappe/builder", "branch": "${BUILDER_VERSION}"},
            {"url": "https://github.com/frappe/wiki", "branch": "${WIKI_VERSION}"},
            {"url": "https://github.com/agatho-daemon/crispy_print", "branch": "${CRISPY_PRINT_VERSION}"}
          ]
          EOF

          cat > build_patch.txt <<'EOF'
          USER root

          RUN apt-get update && apt-get install -y xz-utils curl && \
              curl -Lf https://github.com/typst/typst/releases/download/v0.14.2/typst-x86_64-unknown-linux-musl.tar.xz | tar -xJ -C /tmp && \
              mv /tmp/typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst && \
              chmod +x /usr/local/bin/typst && \
              rm -rf /tmp/typst-x86_64-unknown-linux-musl && \
              apt-get purge -y xz-utils && apt-get autoremove -y && rm -rf /var/lib/apt/lists/*

          USER frappe
          RUN npm config set registry https://registry.npmmirror.com && \
              yarn config set network-timeout 600000 -g && \
              git config --global http.postBuffer 524288000

          USER root
          RUN npm config set registry https://registry.npmmirror.com && \
              npm install -g @openai/codex && \
              command -v codex || ln -sf "$(npm root -g)/@openai/codex/bin/codex.js" /usr/local/bin/codex

          USER frappe
          EOF

          awk '
            /^FROM / { last=NR }
            { lines[NR]=$0 }
            END {
              for (i=1; i<=NR; i++) {
                print lines[i]
                if (i==last) {
                  while ((getline line < "build_patch.txt") > 0) print line
                }
              }
            }
          ' official_repo/images/layered/Containerfile > /tmp/Containerfile.new

          mv /tmp/Containerfile.new official_repo/images/layered/Containerfile

          cat >> official_repo/images/layered/Containerfile <<'EOF'

          USER root
          RUN if [ -d "/home/frappe/frappe-bench/apps/insights" ]; then \
              find /home/frappe/frappe-bench/apps/insights -name "frappe_db.py" | xargs -r sed -i 's/ssl_verify_cert=True/ssl_verify_cert=False/g'; \
              find /home/frappe/frappe-bench/apps/insights -name "frappe_db.py" | xargs -r sed -i 's/ssl_verify_cert=bool(not frappe.conf.developer_mode)/ssl_verify_cert=False/g'; \
              find /home/frappe/frappe-bench/apps/insights -name "mariadb.py" | xargs -r sed -i 's/ssl_verify_cert=use_ssl/ssl_verify_cert=False/g'; \
          fi
          USER frappe
          EOF

          echo "==== apps.json ===="
          cat official_repo/apps.json

          echo "==== Containerfile 前 180 行 ===="
          head -n 180 official_repo/images/layered/Containerfile

      - name: 3. 设置 Docker Buildx 构建引擎
        uses: docker/setup-buildx-action@v4

      - name: 4. 登录 Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 5. 登录阿里云容器镜像服务
        uses: docker/login-action@v4
        with:
          registry: crpi-0bhfwgabexqd04h9.cn-hangzhou.personal.cr.aliyuncs.com
          username: ${{ secrets.ALIRP_USERNAME }}
          password: ${{ secrets.ALIRP_PASSWORD }}

      - name: 6. 构建并推送镜像
        uses: docker/build-push-action@v7
        with:
          context: official_repo
          file: official_repo/images/layered/Containerfile
          push: true
          no-cache: true
          secret-files: |
            apps_json=official_repo/apps.json
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/16-neizhang:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/16-waizhang:latest
            crpi-0bhfwgabexqd04h9.cn-hangzhou.personal.cr.aliyuncs.com/fengmaode/16-neizhang:latest
            crpi-0bhfwgabexqd04h9.cn-hangzhou.personal.cr.aliyuncs.com/fengmaode/16-waizhang:latest
          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=${{ env.FRAPPE_VERSION }}

      - name: 7. 最终校验
        run: |
          docker run --rm --entrypoint sh ${{ secrets.DOCKERHUB_USERNAME }}/16-neizhang:latest -lc '
            echo "==== apps目录 ===="
            ls -la /home/frappe/frappe-bench/apps || true

            echo "==== apps.txt ===="
            cat /home/frappe/frappe-bench/sites/apps.txt || true

            echo "==== bench version ===="
            bench version || true

            echo "==== typst ===="
            which typst || true
            typst --version || true

            echo "==== codex ===="
            which codex || true
            codex --version || true
          '
