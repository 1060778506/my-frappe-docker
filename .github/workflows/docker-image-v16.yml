name: Frappe-v16-多应用全家桶构建

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  frappe_version: v16.53.0          # https://github.com/frappe/frappe/tags
  erpnext_version: v16.53.0         # https://github.com/frappe/erpnext/tags
  hrms_version: v16.53.1            # https://github.com/frappe/hrms/tags
  crm_version: v16.0.1              # https://github.com/frappe/crm/tags
  insights_version: v3.15.1         # https://github.com/frappe/insights/tags

  fengjing_version: develop         # https://github.com/1060778506/fengjing_app/branches

  erpnext_china_version: master     # https://gitee.com/yuzelin/erpnext_china/branches

  beam_version: v15.11.2            # https://github.com/agritheory/beam/tags
  print_designer_version: v1.6.7    # https://github.com/frappe/print_designer/tags
  builder_version: v1.37.1          # https://github.com/frappe/builder/tags
  wiki_version: master              # https://github.com/frappe/wiki/branches
  raven_version: v3.2.0             # https://github.com/frappe/raven/releases

  crispy_print_version: v0.2.0-rc.1 # https://github.com/agatho-daemon/crispy_print/tags

  payments_version: version-16      # https://github.com/frappe/payments
  webshop_version: version-16       # https://github.com/frappe/webshop
  erpnext_shipping_version: v16.0.2 # https://github.com/frappe/erpnext-shipping
  whatsapp_version: v1.2.0          # https://github.com/frappe/whatsapp

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:

      # ============================================================
      # 1. Checkout
      # ============================================================

      - name: 1. 拉取本仓库代码
        uses: actions/checkout@v5

      # Frappe 全家桶镜像较大；只清理 GitHub 临时构建机上本工作流不用的 SDK。
      - name: 检查并释放构建机磁盘空间
        if: ${{ runner.os == 'Linux' && runner.environment == 'github-hosted' }}
        shell: bash
        run: |
          set -euo pipefail

          echo "构建前磁盘和 inode 用量："
          df -h / /var/lib/docker
          df -i / /var/lib/docker

          free_kib=$(df -Pk /var/lib/docker | awk 'NR == 2 {print $4}')
          cleanup_threshold_kib=$((16 * 1024 * 1024))
          if (( free_kib < cleanup_threshold_kib )); then
            echo "Docker 所在磁盘可用空间不足 16 GiB，清理本次构建不用的预装 SDK。"
            for sdk_dir in /usr/local/lib/android/sdk /usr/share/dotnet /usr/local/.ghcup /opt/ghc; do
              if [[ -d "$sdk_dir" ]]; then
                sudo du -sh "$sdk_dir" || true
                sudo rm -rf -- "$sdk_dir"
              fi
            done
          else
            echo "Docker 所在磁盘空间充足，无需清理。"
          fi

          echo "清理后磁盘和 inode 用量："
          df -h / /var/lib/docker
          df -i / /var/lib/docker

          free_kib=$(df -Pk /var/lib/docker | awk 'NR == 2 {print $4}')
          minimum_kib=$((10 * 1024 * 1024))
          if (( free_kib < minimum_kib )); then
            echo "::error::Docker 所在磁盘可用空间仍不足 10 GiB；请使用更大磁盘的构建机。"
            exit 1
          fi


      # ============================================================
      # 2. 准备 frappe_docker
      # ============================================================

      - name: 2. 准备官方 Containerfile 和 apps.json
        run: |
          set -eux

          git clone --depth 1 \
            https://github.com/frappe/frappe_docker.git \
            official_repo


          # ============================================================
          # SocketIO 非标准HTTPS端口补丁
          # ============================================================

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "official_repo/resources/core/nginx/nginx-template.conf"
          )
          text = path.read_text()

          socket_start = text.find("location /socket.io")
          socket_end = text.find("location / {", socket_start)

          if socket_start < 0 or socket_end < 0:
              raise SystemExit(
                  "ERROR: 找不到官方Nginx的SocketIO配置块"
              )

          socket_block = text[socket_start:socket_end]

          old_origin = (
              "proxy_set_header Origin "
              "$proxy_x_forwarded_proto://${FRAPPE_SITE_NAME_HEADER};"
          )
          new_origin = (
              "proxy_set_header Origin "
              "$proxy_x_forwarded_proto://$http_host;"
          )

          old_host = "proxy_set_header Host $host;"
          new_host = "proxy_set_header Host $http_host;"

          if old_origin not in socket_block:
              raise SystemExit(
                  "ERROR: 找不到SocketIO的Origin配置，官方模板可能已变化"
              )

          if old_host not in socket_block:
              raise SystemExit(
                  "ERROR: 找不到SocketIO的Host配置，官方模板可能已变化"
              )

          socket_block = socket_block.replace(
              old_origin, new_origin, 1
          )
          socket_block = socket_block.replace(
              old_host, new_host, 1
          )

          text = (
              text[:socket_start]
              + socket_block
              + text[socket_end:]
          )


          webserver_start = text.find("location @webserver {")
          webserver_end = text.find("\n\t}", webserver_start)
          if webserver_start < 0 or webserver_end < 0:
              raise SystemExit("ERROR: 找不到 @webserver 配置块")

          webserver_block = text[webserver_start:webserver_end]
          if old_host not in webserver_block:
              raise SystemExit("ERROR: 找不到 @webserver 的 Host 配置")

          text = (
              text[:webserver_start]
              + webserver_block.replace(old_host, new_host, 1)
              + text[webserver_end:]
          )


          path.write_text(text)
          print("SocketIO 和 @webserver Nginx 模板补丁已应用")
          PY





          # ============================================================
          # apps.json
          # ============================================================

          cat > official_repo/apps.json <<EOF
          [
            {"url": "https://github.com/frappe/erpnext", "branch": "${erpnext_version}"},
            {"url": "https://github.com/frappe/hrms", "branch": "${hrms_version}"},
            {"url": "https://github.com/frappe/crm", "branch": "${crm_version}"},
            {"url": "https://github.com/frappe/insights", "branch": "${insights_version}"},
            {"url": "https://github.com/1060778506/fengjing_app.git", "branch": "${fengjing_version}"},
            {"url": "https://gitee.com/yuzelin/erpnext_china.git", "branch": "${erpnext_china_version}"},
            {"url": "https://github.com/agritheory/beam", "branch": "${beam_version}"},
            {"url": "https://github.com/frappe/print_designer", "branch": "${print_designer_version}"},
            {"url": "https://github.com/frappe/builder", "branch": "${builder_version}"},
            {"url": "https://github.com/frappe/wiki", "branch": "${wiki_version}"},
            {"url": "https://github.com/frappe/raven", "branch": "${raven_version}"},
            {"url": "https://github.com/agatho-daemon/crispy_print", "branch": "${crispy_print_version}"},
            {"url": "https://github.com/frappe/payments", "branch": "${payments_version}"},
            {"url": "https://github.com/frappe/webshop", "branch": "${webshop_version}"},
            {"url": "https://github.com/frappe/erpnext-shipping", "branch": "${erpnext_shipping_version}"},
            {"url": "https://github.com/frappe/whatsapp", "branch": "${whatsapp_version}"}
          ]
          EOF


          # ============================================================
          # Builder Patch
          #
          # 重点：
          #
          # Frappe 自己使用：
          #
          # /home/frappe/.nvm/versions/node/...
          #
          # 所以必须直接升级这里面的 Node。
          #
          # Crispy Print RC1：
          #
          # Node  24.18.0
          # Yarn  1.22.22
          # Typst >= 0.15.0
          # ============================================================

          cat > builder_patch.txt <<'EOF'
          USER root

          ENV NVM_DIR=/home/frappe/.nvm
          ENV NODE_VERSION=24.18.0
          ENV PATH=${NVM_DIR}/versions/node/v${NODE_VERSION}/bin/:${PATH}

          # ============================================================
          # 升级 Frappe NVM 中的 Node
          # ============================================================

          RUN bash -lc ' \
              export NVM_DIR=/home/frappe/.nvm && \
              . "$NVM_DIR/nvm.sh" && \
              nvm install 24.18.0 && \
              nvm use 24.18.0 && \
              nvm alias default v24.18.0 && \
              npm config set registry https://registry.npmmirror.com && \
              npm install -g yarn@1.22.22 --force && \
              node --version && \
              npm --version && \
              yarn --version \
              ' && \
              chown -R frappe:root /home/frappe/.nvm


          # ============================================================
          # Typst 0.15.0
          # ============================================================

          RUN apt-get update && \
              apt-get install -y --no-install-recommends \
                  curl \
                  ca-certificates \
                  xz-utils && \
              curl -fL \
                "https://github.com/typst/typst/releases/download/v0.15.0/typst-x86_64-unknown-linux-musl.tar.xz" \
                -o /tmp/typst.tar.xz && \
              tar -xJf /tmp/typst.tar.xz -C /tmp && \
              mv \
                /tmp/typst-x86_64-unknown-linux-musl/typst \
                /usr/local/bin/typst && \
              chmod +x /usr/local/bin/typst && \
              rm -rf \
                /tmp/typst.tar.xz \
                /tmp/typst-x86_64-unknown-linux-musl && \
              rm -rf /var/lib/apt/lists/* && \
              typst --version


          # ============================================================
          # Builder 环境配置
          # ============================================================

          USER frappe

          RUN npm config set registry https://registry.npmmirror.com && \
              yarn config set registry https://registry.npmmirror.com -g && \
              yarn config set network-timeout 600000 -g && \
              git config --global http.postBuffer 524288000


          # ============================================================
          # 强制校验
          #
          # 如果这里不是 Node 24.18.0，
          # 直接停止构建，不再浪费时间跑 bench init。
          # ============================================================

          RUN echo "========================================" && \
              echo "Builder 环境校验" && \
              echo "========================================" && \
              echo "PATH=$PATH" && \
              echo "----- NODE -----" && \
              which node && \
              node --version && \
              test "$(node --version)" = "v24.18.0" && \
              echo "----- NPM -----" && \
              which npm && \
              npm --version && \
              echo "----- YARN -----" && \
              which yarn && \
              yarn --version && \
              echo "----- TYPST -----" && \
              which typst && \
              typst --version && \
              echo "========================================" && \
              echo "Builder 环境 OK" && \
              echo "========================================"

          USER frappe
          EOF


          # ============================================================
          # Backend Patch
          #
          # 最终运行镜像也安装：
          #
          # Node 24.18.0
          # Yarn 1.22.22
          # Typst 0.15.0
          # Codex
          # ============================================================

          cat > backend_patch.txt <<'EOF'
          USER root

          COPY --chmod=644 resources/core/nginx/nginx-template.conf /templates/nginx/frappe.conf.template


          # 让 Nginx 将 .mjs 作为 JavaScript 提供给浏览器
          RUN if ! grep -Eq 'application/javascript[[:space:]]+js[[:space:]]+mjs;' /etc/nginx/mime.types; then \
                  grep -Eq 'application/javascript[[:space:]]+js;' /etc/nginx/mime.types && \
                  sed -i -E 's@(application/javascript[[:space:]]+js);@\1 mjs;@' /etc/nginx/mime.types; \
              fi && \
              grep -Eq 'application/javascript[[:space:]]+js[[:space:]]+mjs;' /etc/nginx/mime.types

          # 为运行 Nginx 的 frappe 用户设置可写的请求临时目录
          RUN ! grep -Eq '^[[:space:]]*client_body_temp_path' /etc/nginx/nginx.conf && \
              install -d -o frappe -g root -m 0700 /home/frappe/nginx-client-body && \
              sed -i '/^http {/a\    client_body_temp_path /home/frappe/nginx-client-body;' /etc/nginx/nginx.conf


          ENV NVM_DIR=/home/frappe/.nvm
          ENV NODE_VERSION=24.18.0
          ENV PATH=${NVM_DIR}/versions/node/v${NODE_VERSION}/bin/:${PATH}


          # ============================================================
          # 最终镜像 Node
          # ============================================================

          RUN bash -lc ' \
              export NVM_DIR=/home/frappe/.nvm && \
              . "$NVM_DIR/nvm.sh" && \
              nvm install 24.18.0 && \
              nvm use 24.18.0 && \
              nvm alias default v24.18.0 && \
              npm config set registry https://registry.npmmirror.com && \
              npm install -g yarn@1.22.22 --force && \
              npm install -g @openai/codex && \
              node --version && \
              npm --version && \
              yarn --version && \
              codex --version \
              ' && \
              chown -R frappe:root /home/frappe/.nvm


          # ============================================================
          # Typst
          # ============================================================

          RUN apt-get update && \
              apt-get install -y --no-install-recommends \
                  git \
                  curl \
                  ca-certificates \
                  xz-utils && \
              curl -fL \
                "https://github.com/typst/typst/releases/download/v0.15.0/typst-x86_64-unknown-linux-musl.tar.xz" \
                -o /tmp/typst.tar.xz && \
              tar -xJf /tmp/typst.tar.xz -C /tmp && \
              mv \
                /tmp/typst-x86_64-unknown-linux-musl/typst \
                /usr/local/bin/typst && \
              chmod +x /usr/local/bin/typst && \
              rm -rf \
                /tmp/typst.tar.xz \
                /tmp/typst-x86_64-unknown-linux-musl && \
              rm -rf /var/lib/apt/lists/* && \
              typst --version


          # ============================================================
          # Backend 用户配置
          # ============================================================

          USER frappe

          RUN npm config set registry https://registry.npmmirror.com && \
              yarn config set registry https://registry.npmmirror.com -g && \
              yarn config set network-timeout 600000 -g && \
              git config --global http.postBuffer 524288000


          # ============================================================
          # Backend 强制校验
          # ============================================================

          RUN echo "========================================" && \
              echo "Backend 环境校验" && \
              echo "========================================" && \
              echo "PATH=$PATH" && \
              echo "----- GIT -----" && \
              which git && \
              git --version && \
              echo "----- NODE -----" && \
              which node && \
              node --version && \
              test "$(node --version)" = "v24.18.0" && \
              echo "----- NPM -----" && \
              which npm && \
              npm --version && \
              echo "----- YARN -----" && \
              which yarn && \
              yarn --version && \
              echo "----- TYPST -----" && \
              which typst && \
              typst --version && \
              echo "----- CODEX -----" && \
              which codex && \
              codex --version && \
              echo "========================================" && \
              echo "Backend 环境 OK" && \
              echo "========================================"

          USER frappe
          EOF


          # ============================================================
          # 修改官方 layered Containerfile
          #
          # Builder Patch：
          # 插在 builder FROM 后面
          #
          # Backend Patch：
          # 插在 backend FROM 后面
          # ============================================================

          python3 <<'PY'
          from pathlib import Path

          path = Path(
              "official_repo/images/layered/Containerfile"
          )

          text = path.read_text()

          builder_from = (
              "FROM ${FRAPPE_IMAGE_PREFIX}/build:"
              "${FRAPPE_BRANCH} AS builder\n"
          )

          backend_from = (
              "FROM ${FRAPPE_IMAGE_PREFIX}/base:"
              "${FRAPPE_BRANCH} AS backend\n"
          )

          if builder_from not in text:
              raise SystemExit(
                  "ERROR: 找不到 Builder FROM。"
                  "官方 frappe_docker Containerfile 结构可能已变化。"
              )

          if backend_from not in text:
              raise SystemExit(
                  "ERROR: 找不到 Backend FROM。"
                  "官方 frappe_docker Containerfile 结构可能已变化。"
              )

          builder_patch = Path(
              "builder_patch.txt"
          ).read_text()

          backend_patch = Path(
              "backend_patch.txt"
          ).read_text()


          text = text.replace(
              builder_from,
              builder_from
              + "\n"
              + "# ========================================\n"
              + "# Custom Builder Patch\n"
              + "# ========================================\n"
              + builder_patch
              + "\n",
              1,
          )


          text = text.replace(
              backend_from,
              backend_from
              + "\n"
              + "# ========================================\n"
              + "# Custom Backend Patch\n"
              + "# ========================================\n"
              + backend_patch
              + "\n",
              1,
          )


          path.write_text(text)
          PY


          # Beam 的扫码监听不能接收登录输入框中的账号和密码。
          # 在镜像内修正构建产物；站点的 assets.json 在运行时才会生成。
          cat > official_repo/beam_login_fix.py <<'PY'
          from pathlib import Path

          root = Path('/home/frappe/frappe-bench')
          source = root / 'apps/beam/beam/public/js/scan/scan.js'
          old_source = "ignoreIfFocusOn: '.frappe-input',"
          new_source = "ignoreIfFocusOn: '.frappe-input, input, textarea, [contenteditable=true]',"
          source_text = source.read_text()
          if source_text.count(old_source) != 1:
              raise SystemExit('Beam scanner source changed; inspect the upstream fix before rebuilding')

          bundle_dir = root / 'apps/beam/beam/public/dist/js'
          bundles = list(bundle_dir.glob('beam-web.bundle.*.js'))
          if len(bundles) != 1:
              raise SystemExit(f'Expected one Beam bundle, found {len(bundles)}')
          old_file = bundles[0]
          old_bundle = 'ignoreIfFocusOn:".frappe-input"'
          new_bundle = 'ignoreIfFocusOn:".frappe-input, input, textarea, [contenteditable=true]"'
          bundle = old_file.read_text()
          if bundle.count(old_bundle) != 1:
              raise SystemExit('Beam scanner bundle changed; inspect the upstream fix before rebuilding')
          # 兼容当前站点已生成的资源映射；新站点使用上面修正的原文件。
          compatible_file = bundle_dir / 'beam-web.bundle.RVNLOGIN.js'
          if compatible_file.exists():
              raise SystemExit('Beam compatibility bundle already exists; inspect before overwriting')
          source.write_text(source_text.replace(old_source, new_source, 1))
          bundle = bundle.replace(old_bundle, new_bundle, 1)
          old_file.write_text(bundle)
          compatible_file.write_text(bundle)
          print('Beam login scanner fix applied:', old_file.name, compatible_file.name)
          PY

          cat >> official_repo/images/layered/Containerfile <<'EOF'

          # Prevent Beam barcode scanning from intercepting mobile OAuth login fields.
          USER root
          ARG beam_version
          COPY beam_login_fix.py /tmp/beam_login_fix.py
          RUN test "${beam_version}" = "v15.11.2" || { echo "Beam version changed; review or remove the login patch" >&2; exit 1; } && \
              python3 /tmp/beam_login_fix.py && rm /tmp/beam_login_fix.py
          USER frappe
          EOF

          # ============================================================
          # Insights SSL Patch
          # ============================================================

          cat >> official_repo/images/layered/Containerfile <<'EOF'

          # ============================================================
          # Insights SSL Patch
          # ============================================================

          USER root

          RUN if [ -d "/home/frappe/frappe-bench/apps/insights" ]; then \
              find \
                /home/frappe/frappe-bench/apps/insights \
                -name "frappe_db.py" \
                -print0 | \
                xargs -0 -r sed -i \
                's/ssl_verify_cert=True/ssl_verify_cert=False/g'; \
              find \
                /home/frappe/frappe-bench/apps/insights \
                -name "frappe_db.py" \
                -print0 | \
                xargs -0 -r sed -i \
                's/ssl_verify_cert=bool(not frappe.conf.developer_mode)/ssl_verify_cert=False/g'; \
              find \
                /home/frappe/frappe-bench/apps/insights \
                -name "mariadb.py" \
                -print0 | \
                xargs -0 -r sed -i \
                's/ssl_verify_cert=use_ssl/ssl_verify_cert=False/g'; \
          fi

          USER frappe
          EOF


          # ============================================================
          # 安装 Playwright、系统依赖、Chromium
          # ============================================================

          cat >> official_repo/images/layered/Containerfile <<'EOF'

          USER root

          ENV PLAYWRIGHT_BROWSERS_PATH=/opt/playwright-browsers

          RUN /home/frappe/frappe-bench/env/bin/python -m pip install playwright && \
              /home/frappe/frappe-bench/env/bin/python -m playwright install-deps chromium && \
              install -d -o frappe -g root /opt/playwright-browsers

          USER frappe

          RUN /home/frappe/frappe-bench/env/bin/python -m playwright install chromium

          EOF


          # ============================================================
          # 输出调试信息
          # ============================================================

          echo ""
          echo "========================================"
          echo "apps.json"
          echo "========================================"

          cat official_repo/apps.json


          echo ""
          echo "========================================"
          echo "最终 Containerfile"
          echo "========================================"

          sed -n \
            '1,320p' \
            official_repo/images/layered/Containerfile


      # ============================================================
      # 3. Buildx
      # ============================================================

      - name: 3. 设置 Docker Buildx 构建引擎
        uses: docker/setup-buildx-action@v4


      # ============================================================
      # 4. Docker Hub
      # ============================================================

      - name: 4. 登录 Docker Hub
        uses: docker/login-action@v4

        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # ============================================================
      # 5. 阿里云
      # ============================================================

      - name: 5. 登录阿里云容器镜像服务
        uses: docker/login-action@v4

        with:
          registry: crpi-0bhfwgabexqd04h9.cn-hangzhou.personal.cr.aliyuncs.com
          username: ${{ secrets.ALIRP_USERNAME }}
          password: ${{ secrets.ALIRP_PASSWORD }}


      # ============================================================
      # 6. Build
      # ============================================================

      - name: 6. 构建并推送镜像
        uses: docker/build-push-action@v7

        with:
          context: official_repo

          file: official_repo/images/layered/Containerfile

          push: true

          no-cache: true
          provenance: false
          sbom: false
          secret-files: |
            apps_json=official_repo/apps.json

          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/16-neizhang:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/16-waizhang:latest
            crpi-0bhfwgabexqd04h9.cn-hangzhou.personal.cr.aliyuncs.com/fengmaode/16-neizhang:latest
            crpi-0bhfwgabexqd04h9.cn-hangzhou.personal.cr.aliyuncs.com/fengmaode/16-waizhang:latest

          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=${{ env.frappe_version }}
            beam_version=${{ env.beam_version }}


      # ============================================================
      # 7. 最终校验
      # ============================================================

      - name: 7. 最终校验
        run: |
          set -eux

          docker pull \
            ${{ secrets.DOCKERHUB_USERNAME }}/16-neizhang:latest


          docker run \
            --rm \
            --entrypoint sh \
            ${{ secrets.DOCKERHUB_USERNAME }}/16-neizhang:latest \
            -lc '

              echo ""
              echo "========================================"
              echo "Apps 目录"
              echo "========================================"

              ls -la \
                /home/frappe/frappe-bench/apps


              echo ""
              echo "========================================"
