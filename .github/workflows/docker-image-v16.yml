name: Frappe-v16-多应用全家桶构建

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FRAPPE_VERSION: v16.31.0
  ERPNEXT_VERSION: v16.32.3
  HRMS_VERSION: v16.16.0
  CRM_VERSION: v1.81.2
  INSIGHTS_VERSION: v3.12.6

  FENGJING_VERSION: develop
  # DYEPRINT 暂时禁用

  ERPNEXT_CHINA_VERSION: master

  BEAM_VERSION: v15.11.1
  PRINT_DESIGNER_VERSION: v1.6.7
  BUILDER_VERSION: v1.32.0
  WIKI_VERSION: master

  # 固定 Crispy Print RC1，避免 develop 后续变化导致构建突然失败
  CRISPY_PRINT_VERSION: v0.2.0-rc.1

  # Crispy Print RC1 要求
  NODE_VERSION: 24.18.0
  TYPST_VERSION: 0.15.0
  YARN_VERSION: 1.22.22

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:

      - name: 1. 拉取本仓库代码
        uses: actions/checkout@v5

      - name: 2. 准备官方 Containerfile 和 apps.json
        run: |
          set -eux

          git clone --depth 1 https://github.com/frappe/frappe_docker.git official_repo

          # ============================================================
          # apps.json
          # ============================================================

          cat > official_repo/apps.json <<EOF
          [
            {"url": "https://github.com/frappe/erpnext", "branch": "${ERPNEXT_VERSION}"},
            {"url": "https://github.com/frappe/hrms", "branch": "${HRMS_VERSION}"},
            {"url": "https://github.com/frappe/crm", "branch": "${CRM_VERSION}"},
            {"url": "https://github.com/frappe/insights", "branch": "${INSIGHTS_VERSION}"},
            {"url": "https://github.com/1060778506/fengjing_app.git", "branch": "${FENGJING_VERSION}"},
            {"url": "https://gitee.com/yuzelin/erpnext_china.git", "branch": "${ERPNEXT_CHINA_VERSION}"},
            {"url": "https://github.com/agritheory/beam", "branch": "${BEAM_VERSION}"},
            {"url": "https://github.com/frappe/print_designer", "branch": "${PRINT_DESIGNER_VERSION}"},
            {"url": "https://github.com/frappe/builder", "branch": "${BUILDER_VERSION}"},
            {"url": "https://github.com/frappe/wiki", "branch": "${WIKI_VERSION}"},
            {"url": "https://github.com/agatho-daemon/crispy_print", "branch": "${CRISPY_PRINT_VERSION}"}
          ]
          EOF


          # ============================================================
          # Builder 阶段补丁
          #
          # 重点：
          # 必须在 bench init 之前升级 Node。
          #
          # crispy_print 要求：
          # Node  >= 24.18.0 <25
          # Yarn  >= 1.22
          # Typst >= 0.15.0
          # ============================================================

          cat > builder_patch.txt <<EOF
          USER root

          ARG CUSTOM_NODE_VERSION=${NODE_VERSION}
          ARG CUSTOM_TYPST_VERSION=${TYPST_VERSION}
          ARG CUSTOM_YARN_VERSION=${YARN_VERSION}

          RUN apt-get update && \
              apt-get install -y --no-install-recommends \
                  curl \
                  ca-certificates \
                  xz-utils && \
              rm -rf /var/lib/apt/lists/*

          # ------------------------------------------------------------
          # Node.js 24.18.0
          # ------------------------------------------------------------

          RUN curl -fL \
              "https://nodejs.org/dist/v\${CUSTOM_NODE_VERSION}/node-v\${CUSTOM_NODE_VERSION}-linux-x64.tar.xz" \
              -o /tmp/node.tar.xz && \
              tar -xJf /tmp/node.tar.xz \
                  -C /usr/local \
                  --strip-components=1 && \
              rm -f /tmp/node.tar.xz && \
              node --version && \
              npm --version

          # ------------------------------------------------------------
          # Yarn Classic 1.22.22
          # ------------------------------------------------------------

          RUN npm config set registry https://registry.npmmirror.com && \
              npm install -g yarn@\${CUSTOM_YARN_VERSION} --force && \
              yarn --version

          # ------------------------------------------------------------
          # Typst 0.15.0
          # ------------------------------------------------------------

          RUN curl -fL \
              "https://github.com/typst/typst/releases/download/v\${CUSTOM_TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" \
              -o /tmp/typst.tar.xz && \
              tar -xJf /tmp/typst.tar.xz -C /tmp && \
              mv \
                "/tmp/typst-x86_64-unknown-linux-musl/typst" \
                /usr/local/bin/typst && \
              chmod +x /usr/local/bin/typst && \
              rm -rf \
                /tmp/typst.tar.xz \
                /tmp/typst-x86_64-unknown-linux-musl && \
              typst --version

          USER frappe

          RUN npm config set registry https://registry.npmmirror.com && \
              yarn config set registry https://registry.npmmirror.com -g && \
              yarn config set network-timeout 600000 -g && \
              git config --global http.postBuffer 524288000

          RUN echo "===== Builder Toolchain =====" && \
              node --version && \
              npm --version && \
              yarn --version && \
              typst --version

          USER frappe
          EOF


          # ============================================================
          # Backend 最终镜像补丁
          #
          # Builder 和 Backend 是两个 Docker stage。
          #
          # Builder 中安装 Node/Typst 是为了构建 Crispy Print。
          # Backend 中还必须安装 Typst，运行时生成 PDF 要使用。
          # 同时保留 Codex。
          # ============================================================

          cat > backend_patch.txt <<EOF
          USER root

          ARG CUSTOM_NODE_VERSION=${NODE_VERSION}
          ARG CUSTOM_TYPST_VERSION=${TYPST_VERSION}
          ARG CUSTOM_YARN_VERSION=${YARN_VERSION}

          RUN apt-get update && \
              apt-get install -y --no-install-recommends \
                  curl \
                  ca-certificates \
                  xz-utils && \
              rm -rf /var/lib/apt/lists/*

          # ------------------------------------------------------------
          # Node.js 24.18.0
          # ------------------------------------------------------------

          RUN curl -fL \
              "https://nodejs.org/dist/v\${CUSTOM_NODE_VERSION}/node-v\${CUSTOM_NODE_VERSION}-linux-x64.tar.xz" \
              -o /tmp/node.tar.xz && \
              tar -xJf /tmp/node.tar.xz \
                  -C /usr/local \
                  --strip-components=1 && \
              rm -f /tmp/node.tar.xz && \
              node --version && \
              npm --version

          # ------------------------------------------------------------
          # Yarn Classic
          # ------------------------------------------------------------

          RUN npm config set registry https://registry.npmmirror.com && \
              npm install -g yarn@\${CUSTOM_YARN_VERSION} --force && \
              yarn --version

          # ------------------------------------------------------------
          # Typst
          # ------------------------------------------------------------

          RUN curl -fL \
              "https://github.com/typst/typst/releases/download/v\${CUSTOM_TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" \
              -o /tmp/typst.tar.xz && \
              tar -xJf /tmp/typst.tar.xz -C /tmp && \
              mv \
                "/tmp/typst-x86_64-unknown-linux-musl/typst" \
                /usr/local/bin/typst && \
              chmod +x /usr/local/bin/typst && \
              rm -rf \
                /tmp/typst.tar.xz \
                /tmp/typst-x86_64-unknown-linux-musl && \
              typst --version

          # ------------------------------------------------------------
          # OpenAI Codex
          # ------------------------------------------------------------

          RUN npm config set registry https://registry.npmmirror.com && \
              npm install -g @openai/codex && \
              command -v codex && \
              codex --version

          USER frappe

          RUN npm config set registry https://registry.npmmirror.com && \
              yarn config set registry https://registry.npmmirror.com -g && \
              yarn config set network-timeout 600000 -g && \
              git config --global http.postBuffer 524288000

          USER frappe
          EOF


          # ============================================================
          # 修改官方 layered Containerfile
          #
          # 这里不再使用“最后一个 FROM”。
          #
          # 精确插入：
          #
          # 1. builder_patch
          #    -> FROM ... AS builder 后
          #
          # 2. backend_patch
          #    -> FROM ... AS backend 后
          #
          # ============================================================

          python3 <<'PY'
          from pathlib import Path

          containerfile = Path(
              "official_repo/images/layered/Containerfile"
          )

          text = containerfile.read_text()

          builder_patch = Path("builder_patch.txt").read_text()
          backend_patch = Path("backend_patch.txt").read_text()

          builder_from = (
              "FROM ${FRAPPE_IMAGE_PREFIX}/build:"
              "${FRAPPE_BRANCH} AS builder\n"
          )

          backend_from = (
              "FROM ${FRAPPE_IMAGE_PREFIX}/base:"
              "${FRAPPE_BRANCH} AS backend\n"
          )

          if builder_from not in text:
              raise SystemExit(
                  "ERROR: 找不到官方 builder FROM，"
                  "frappe_docker Containerfile 结构可能发生变化"
              )

          if backend_from not in text:
              raise SystemExit(
                  "ERROR: 找不到官方 backend FROM，"
                  "frappe_docker Containerfile 结构可能发生变化"
              )

          text = text.replace(
              builder_from,
              builder_from
              + "\n"
              + "# ===== 自定义 Builder 环境 =====\n"
              + builder_patch
              + "\n"
              + "# ===== 自定义 Builder 环境结束 =====\n\n",
              1,
          )

          text = text.replace(
              backend_from,
              backend_from
              + "\n"
              + "# ===== 自定义 Backend 环境 =====\n"
              + backend_patch
              + "\n"
              + "# ===== 自定义 Backend 环境结束 =====\n\n",
              1,
          )

          containerfile.write_text(text)
          PY


          # ============================================================
          # Insights SSL Patch
          # ============================================================

          cat >> official_repo/images/layered/Containerfile <<'EOF'

          # ============================================================
          # Insights SSL Patch
          # ============================================================

          USER root

          RUN if [ -d "/home/frappe/frappe-bench/apps/insights" ]; then \
              find /home/frappe/frappe-bench/apps/insights \
                -name "frappe_db.py" \
                -print0 | \
                xargs -0 -r sed -i \
                  's/ssl_verify_cert=True/ssl_verify_cert=False/g'; \
              find /home/frappe/frappe-bench/apps/insights \
                -name "frappe_db.py" \
                -print0 | \
                xargs -0 -r sed -i \
                  's/ssl_verify_cert=bool(not frappe.conf.developer_mode)/ssl_verify_cert=False/g'; \
              find /home/frappe/frappe-bench/apps/insights \
                -name "mariadb.py" \
                -print0 | \
                xargs -0 -r sed -i \
                  's/ssl_verify_cert=use_ssl/ssl_verify_cert=False/g'; \
          fi

          USER frappe
          EOF


          # ============================================================
          # 输出检查
          # ============================================================

          echo ""
          echo "========================================"
          echo "apps.json"
          echo "========================================"
          cat official_repo/apps.json

          echo ""
          echo "========================================"
          echo "Containerfile 前 260 行"
          echo "========================================"
          sed -n '1,260p' \
            official_repo/images/layered/Containerfile


      - name: 3. 设置 Docker Buildx 构建引擎
        uses: docker/setup-buildx-action@v4


      - name: 4. 登录 Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      - name: 5. 登录阿里云容器镜像服务
        uses: docker/login-action@v4
        with:
          registry: crpi-0bhfwgabexqd04h9.cn-hangzhou.personal.cr.aliyuncs.com
          username: ${{ secrets.ALIRP_USERNAME }}
          password: ${{ secrets.ALIRP_PASSWORD }}


      - name: 6. 构建并推送镜像
        uses: docker/build-push-action@v7
        with:
          context: official_repo
          file: official_repo/images/layered/Containerfile

          push: true
          no-cache: true

          secret-files: |
            apps_json=official_repo/apps.json

          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/16-neizhang:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/16-waizhang:latest
            crpi-0bhfwgabexqd04h9.cn-hangzhou.personal.cr.aliyuncs.com/fengmaode/16-neizhang:latest
            crpi-0bhfwgabexqd04h9.cn-hangzhou.personal.cr.aliyuncs.com/fengmaode/16-waizhang:latest

          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=${{ env.FRAPPE_VERSION }}


      - name: 7. 最终校验
        run: |
          set -eux

          docker run \
            --rm \
            --entrypoint sh \
            ${{ secrets.DOCKERHUB_USERNAME }}/16-neizhang:latest \
            -lc '

              echo ""
              echo "========================================"
              echo "apps 目录"
              echo "========================================"

              ls -la /home/frappe/frappe-bench/apps || true


              echo ""
              echo "========================================"
              echo "apps.txt"
              echo "========================================"

              cat /home/frappe/frappe-bench/sites/apps.txt || true


              echo ""
              echo "========================================"
              echo "bench version"
              echo "========================================"

              bench version || true


              echo ""
              echo "========================================"
              echo "Node"
              echo "========================================"

              which node
              node --version


              echo ""
              echo "========================================"
              echo "npm"
              echo "========================================"

              which npm
              npm --version


              echo ""
              echo "========================================"
              echo "Yarn"
              echo "========================================"

              which yarn
              yarn --version


              echo ""
              echo "========================================"
              echo "Typst"
              echo "========================================"

              which typst
              typst --version


              echo ""
              echo "========================================"
              echo "Codex"
              echo "========================================"

              which codex
              codex --version


              echo ""
              echo "========================================"
              echo "Crispy Print"
              echo "========================================"

              if [ -d /home/frappe/frappe-bench/apps/crispy_print ]; then
                  echo "crispy_print 已安装"
                  grep -A5 "\"engines\"" \
                    /home/frappe/frappe-bench/apps/crispy_print/package.json \
                    || true
              else
                  echo "ERROR: crispy_print 不存在"
                  exit 1
              fi


              echo ""
              echo "========================================"
              echo "全部校验完成"
              echo "========================================"
            '
